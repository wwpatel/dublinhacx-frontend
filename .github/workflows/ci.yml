name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Typecheck, lint, unit and e2e tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dubx-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: dubx-app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dubx-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            dubx-app/playwright-report
            dubx-app/test-results
          retention-days: 7

  tauri:
    name: Tauri shell compiles
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dubx-app/src-tauri
      - run: cargo check --manifest-path dubx-app/src-tauri/Cargo.toml
